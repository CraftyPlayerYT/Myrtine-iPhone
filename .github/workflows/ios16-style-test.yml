name: Build iOS 16 Glass Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LegacyGlassTest/**"
      - ".github/workflows/ios16-style-test.yml"

jobs:
  build-test-app:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: LegacyGlassTest
        run: xcodegen generate

      - name: Build for physical iPhones
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -project LegacyGlassTest/LegacyGlassTest.xcodeproj \
            -scheme LegacyGlassTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath LegacyGlassTest/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify iOS 16 compatibility
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="LegacyGlassTest/DerivedData/Build/Products/Release-iphoneos/MyrtineGlass.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -x "$APP_PATH/MyrtineGlass"

          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP_PATH/Info.plist")

          test "$MINIMUM_OS" = "16.0"
          test "$PLATFORM" = "iPhoneOS"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="LegacyGlassTest/DerivedData/Build/Products/Release-iphoneos/MyrtineGlass.app"
          mkdir -p LegacyGlassTest/Package/Payload
          ditto "$APP_PATH" "LegacyGlassTest/Package/Payload/MyrtineGlass.app"

          (
            cd LegacyGlassTest/Package
            /usr/bin/zip -qry Myrtine-Glass-iOS16-unsigned.ipa Payload
          )

          unzip -l LegacyGlassTest/Package/Myrtine-Glass-iOS16-unsigned.ipa
          shasum -a 256 LegacyGlassTest/Package/Myrtine-Glass-iOS16-unsigned.ipa \
            > LegacyGlassTest/Package/Myrtine-Glass-iOS16-unsigned.ipa.sha256

      - name: Capture 4.7-inch visual preview
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_TYPE_LINE=$(xcrun simctl list devicetypes | grep -E -m1 'iPhone SE \(3rd generation\)|iPhone SE \(2nd generation\)|iPhone 8')
          DEVICE_TYPE_ID=$(printf '%s\n' "$DEVICE_TYPE_LINE" | sed -E 's/.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\)$/\1/')
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep 'iOS ' | tail -1)
          RUNTIME_ID=$(printf '%s\n' "$RUNTIME_LINE" | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+).*/\1/')

          test -n "$DEVICE_TYPE_ID"
          test -n "$RUNTIME_ID"

          DEVICE_ID=$(xcrun simctl create 'Myrtine 4.7-inch Layout' "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          test -n "$DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcodebuild build \
            -project LegacyGlassTest/LegacyGlassTest.xcodeproj \
            -scheme LegacyGlassTest \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath LegacyGlassTest/SimulatorData \
            CODE_SIGNING_ALLOWED=NO

          SIMULATOR_APP="LegacyGlassTest/SimulatorData/Build/Products/Debug-iphonesimulator/MyrtineGlass.app"
          test -d "$SIMULATOR_APP"

          xcrun simctl install "$DEVICE_ID" "$SIMULATOR_APP"
          xcrun simctl launch "$DEVICE_ID" fr.myrtine.legacyglasstest
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot LegacyGlassTest/Package/iPhone-8-layout.png

          WIDTH=$(sips -g pixelWidth LegacyGlassTest/Package/iPhone-8-layout.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight LegacyGlassTest/Package/iPhone-8-layout.png | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "750"
          test "$HEIGHT" = "1334"

      - name: Upload iPhone 8 compatible IPA
        uses: actions/upload-artifact@v4
        with:
          name: Myrtine-Glass-iPhone8-iOS16
          path: |
            LegacyGlassTest/Package/Myrtine-Glass-iOS16-unsigned.ipa
            LegacyGlassTest/Package/Myrtine-Glass-iOS16-unsigned.ipa.sha256
            LegacyGlassTest/Package/iPhone-8-layout.png
          if-no-files-found: error
          retention-days: 30
